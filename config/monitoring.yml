# Monitoring Configuration
# 量化交易建议系统 - 监控配置

# Prometheus Configuration
prometheus:
  enabled: true
  port: 9090
  scrape_interval: 15s
  evaluation_interval: 15s

  # Scrape targets
  targets:
    - name: quant-advisor-backend
      url: http://localhost:8000/metrics
      labels:
        service: backend
        environment: production

    - name: quant-advisor-frontend
      url: http://localhost:3000/metrics
      labels:
        service: frontend
        environment: production

    - name: postgresql
      url: http://localhost:9187/metrics
      labels:
        service: database

    - name: redis
      url: http://localhost:9121/metrics
      labels:
        service: cache

    - name: node-exporter
      url: http://localhost:9100/metrics
      labels:
        service: system

# Alert Rules
alerting:
  rules:
    # High CPU usage
    - alert: HighCpuUsage
      expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage on {{ $labels.instance }}"
        description: "CPU usage is above 80% for 5 minutes"

    # High memory usage
    - alert: HighMemoryUsage
      expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage on {{ $labels.instance }}"
        description: "Memory usage is above 90%"

    # Disk space low
    - alert: DiskSpaceLow
      expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Low disk space on {{ $labels.instance }}"
        description: "Disk space is below 10%"

    # High error rate
    - alert: HighErrorRate
      expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High error rate on {{ $labels.job }}"
        description: "Error rate is above 5%"

    # Slow response time
    - alert: SlowResponseTime
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Slow response time on {{ $labels.job }}"
        description: "95th percentile response time is above 2 seconds"

    # Service down
    - alert: ServiceDown
      expr: up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Service {{ $labels.job }} is down"
        description: "{{ $labels.instance }} is unreachable"

    # High database connections
    - alert: HighDatabaseConnections
      expr: pg_stat_activity_count > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High database connections"
        description: "Database connections are above 80"

    # Redis memory high
    - alert: RedisMemoryHigh
      expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Redis memory usage is high"
        description: "Redis memory usage is above 80%"

# Alertmanager Configuration
alertmanager:
  enabled: true
  port: 9093

  # Notification receivers
  receivers:
    - name: email-alerts
      email_configs:
        - to: admin@yourdomain.com
          from: alerts@yourdomain.com
          smarthost: smtp.yourdomain.com:587
          auth_username: alerts@yourdomain.com
          auth_password: your_smtp_password

    - name: slack-alerts
      slack_configs:
        - api_url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
          channel: '#alerts'
          title: '{{ .CommonAnnotations.summary }}'
          text: '{{ .CommonAnnotations.description }}'

  # Route configuration
  routes:
    - match:
        severity: critical
      receiver: email-alerts
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: slack-alerts
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

# Grafana Configuration
grafana:
  enabled: true
  port: 3001
  admin_user: admin
  admin_password: your_grafana_password

  # Dashboards
  dashboards:
    - name: System Overview
      path: dashboards/system-overview.json

    - name: API Performance
      path: dashboards/api-performance.json

    - name: Database Metrics
      path: dashboards/database-metrics.json

    - name: Business Metrics
      path: dashboards/business-metrics.json

# Logging Configuration (ELK Stack)
logging:
  elasticsearch:
    enabled: true
    host: localhost
    port: 9200
    index_name: quant-advisor-logs

  logstash:
    enabled: true
    port: 5044

  kibana:
    enabled: true
    port: 5601

  # Log levels
  levels:
    production: WARNING
    development: DEBUG

  # Log retention
  retention_days: 30

# Health Checks
health_checks:
  interval: 30s
  timeout: 10s

  endpoints:
    - name: backend
      url: http://localhost:8000/health
      expected_status: 200

    - name: frontend
      url: http://localhost:3000/health
      expected_status: 200

    - name: database
      command: pg_isready -U postgres
      expected_exit_code: 0

    - name: redis
      command: redis-cli ping
      expected_output: PONG

# Uptime Monitoring
uptime:
  enabled: true
  check_interval: 60s

  targets:
    - name: production-api
      url: https://your-domain.com/api/health
      expected_status: 200

    - name: production-frontend
      url: https://your-domain.com
      expected_status: 200

  # Notification on downtime
  notify:
    email: admin@yourdomain.com
    slack_channel: '#uptime'
